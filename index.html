<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astaxanthin 12mg Sales Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0f1e;--bg2:#111827;--border:#1e293b;--text:#e2e8f0;--muted:#64748b;--accent:#38bdf8;--green:#22c55e;--red:#ef4444}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
.hdr{background:linear-gradient(135deg,#111827,#0a0f1e);border-bottom:1px solid #1e3a5f;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.hdr-title{font-size:19px;font-weight:800;color:#f8fafc}
.hdr-sub{font-size:12px;color:#475569;margin-top:2px}
.sync-badge{font-size:11px;color:var(--green);background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);border-radius:20px;padding:3px 12px;display:none}
.refresh-btn{background:none;border:1px solid #334155;border-radius:8px;padding:4px 12px;color:#94a3b8;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;padding:0 24px;background:var(--bg);border-bottom:1px solid var(--border);gap:2px;overflow-x:auto}
.tab{padding:10px 16px;font-size:13px;font-weight:400;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif}
.tab.active{color:var(--accent);font-weight:700;border-bottom-color:var(--accent)}
.body{padding:20px 24px}
.section{display:none}.section.active{display:block}
.card{background:var(--bg2);border-radius:12px;padding:16px 20px;border:1px solid var(--border);margin-bottom:16px}
.card-t{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.chart-wrap{background:var(--bg2);border-radius:12px;padding:16px 20px;border:1px solid var(--border);margin-bottom:16px}
.chart-t{font-size:14px;font-weight:700;color:#f8fafc;margin-bottom:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:700px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}
.sku-card{background:var(--bg2);border-radius:12px;padding:14px 16px;border:1px solid var(--border);border-left-width:3px}
.yest-grid{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.yest-card{background:var(--bg);border-radius:10px;padding:12px 16px;flex:1;min-width:120px;border:1px solid transparent}
.sku-filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.sku-filter-btn{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--border);font-weight:600}
th:first-child{text-align:left}th:not(:first-child){text-align:right}
td{font-size:13px;color:#f8fafc;padding:7px 8px;border-bottom:1px solid var(--bg)}
td:first-child{text-align:left;color:var(--text)}td:not(:first-child){text-align:right}
.pos{color:var(--green)}.neg{color:var(--red)}.muted-c{color:var(--muted)}
.inp{background:var(--bg);border:1px solid #334155;border-radius:8px;padding:8px 12px;color:#f8fafc;font-size:14px;width:100%;font-family:'DM Sans',sans-serif;outline:none}
.inp:focus{border-color:var(--accent)}
.btn{background:#3b82f6;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:14px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn:hover{background:#2563eb}
.btn:disabled{background:#334155;cursor:not-allowed}
.info-box{background:rgba(56,189,248,.05);border:1px solid rgba(56,189,248,.2);border-radius:10px;padding:12px 16px;margin-bottom:12px;font-size:13px;color:var(--accent);line-height:1.7}
.warn-box{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);border-radius:10px;padding:12px 16px;margin-bottom:12px;font-size:13px;color:#fbbf24;line-height:1.7}
.warn-box code{background:rgba(251,191,36,.15);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:12px}
.loading{text-align:center;padding:60px;color:var(--muted);font-size:14px}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid #334155;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="hdr-title">🦐 Astaxanthin 12mg Sales Dashboard</div>
    <div class="hdr-sub">45ct · 60ct · 90ct · 120ct</div>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="sync-badge" id="syncBadge">⟳ <span id="syncTime"></span></div>
    <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('overview',event)">📊 Overview</button>
  <button class="tab" onclick="showTab('daily',event)">📈 Daily Trend</button>
  <button class="tab" onclick="showTab('monthly',event)">📅 Monthly</button>
  <button class="tab" onclick="showTab('baseline',event)">🎯 Baseline</button>
  <button class="tab" onclick="showTab('input',event)">✏️ Enter Data</button>
</div>

<div class="body">
  <div class="section active" id="tab-overview"><div class="loading"><span class="spinner"></span>Loading...</div></div>
  <div class="section" id="tab-daily">
    <div class="sku-filters" id="skuFilters"></div>
    <div id="dailyContent"><div class="loading"><span class="spinner"></span>Loading...</div></div>
  </div>
  <div class="section" id="tab-monthly"><div class="loading"><span class="spinner"></span>Loading...</div></div>
  <div class="section" id="tab-baseline"><div class="loading"><span class="spinner"></span>Loading...</div></div>
  <div class="section" id="tab-input"></div>
</div>

<script>
// ============================================================
//  CONFIG — fill in your GitHub info
// ============================================================
const GITHUB_OWNER = 'krischenyt';
const GITHUB_REPO  = 'astaxanthin-dashboard';
const GITHUB_TOKEN = '';  // Personal Access Token (repo scope)
const DATA_PATH    = 'data/sales.json';
// ============================================================

const SKUS = [
  {key:'12mg_45', label:'45ct', color:'#f59e0b', asp:18.76},
  {key:'12mg_60', label:'60ct', color:'#10b981', asp:24.28},
  {key:'12mg_90', label:'90ct', color:'#6366f1', asp:29.38},
  {key:'12mg_120',label:'120ct',color:'#ef4444', asp:34.24},
];

let salesData = {};
let activeSku = '12mg_120';
let charts = {};
let fileSha = '';

function fmt(n){return(n||0).toLocaleString()}
function fmtD(d){return d?d.slice(5):''}
function getLookup(arr){const m={};(arr||[]).forEach(r=>{m[r.date]=r.sales});return m}
function getMonthMap(arr){const m={};(arr||[]).forEach(r=>{const mo=r.date.slice(0,7);m[mo]=(m[mo]||0)+r.sales});return m}
function getDailyAvg(arr){if(!arr?.length)return 0;const r=[...arr].slice(-30);return Math.round(r.reduce((s,x)=>s+x.sales,0)/r.length)}
function getMonthAvg(arr){if(!arr?.length)return 0;const m={};arr.forEach(r=>{const mo=r.date.slice(0,7);m[mo]=(m[mo]||0)+r.sales});const v=Object.values(m).slice(0,-1);if(!v.length)return Object.values(m)[0]||0;return Math.round(v.reduce((a,b)=>a+b,0)/v.length)}
function killChart(id){if(charts[id]){charts[id].destroy();delete charts[id]}}

function ttPlugin(){
  return{backgroundColor:'#1e293b',titleColor:'#f8fafc',bodyColor:'#e2e8f0',borderColor:'#334155',borderWidth:1,padding:10,cornerRadius:8}
}
function ttCallbacks(fullDates){
  return{callbacks:{title:items=>{const i=items[0].dataIndex;return fullDates?fullDates[i]:items[0].label}}}
}
function scales(stacked=false,minimal=false){
  return{
    x:{stacked,grid:{color:'#1e3a5f'},ticks:{color:'#64748b',font:{size:minimal?8:10},maxTicksLimit:minimal?6:12},border:{display:false}},
    y:{stacked,grid:{color:'#1e3a5f'},ticks:{color:'#64748b',font:{size:10}},border:{display:false}}
  }
}

async function loadData(){
  try{
    const url=`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_PATH}`;
    const headers={'Accept':'application/vnd.github+json'};
    if(GITHUB_TOKEN)headers['Authorization']=`Bearer ${GITHUB_TOKEN}`;
    const r=await fetch(url,{headers});
    const json=await r.json();
    fileSha=json.sha||'';
    salesData=JSON.parse(atob(json.content.replace(/\n/g,'')));
    document.getElementById('syncBadge').style.display='inline-block';
    document.getElementById('syncTime').textContent=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    console.error('Load error:',e);
    try{const r=await fetch('data/sales.json?t='+Date.now());salesData=await r.json()}catch(e2){}
  }
  renderAll();
}

async function saveData(newData){
  if(!GITHUB_TOKEN){
    return {ok:false, msg:'GitHub Token not set in index.html'};
  }
  try{
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(newData,null,2))));
    const body={message:'Update sales data',content,sha:fileSha};
    const r=await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_PATH}`,{
      method:'PUT',
      headers:{'Authorization':`Bearer ${GITHUB_TOKEN}`,'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    if(!r.ok){const e=await r.json();return{ok:false,msg:e.message||'Save failed'}}
    const json=await r.json();
    fileSha=json.content?.sha||fileSha;
    return{ok:true};
  }catch(e){return{ok:false,msg:e.message}}
}

function renderAll(){renderOverview();renderDailyFilters();renderDaily(activeSku);renderMonthly();renderBaseline();renderInput()}

function renderOverview(){
  const yDate=new Date();yDate.setDate(yDate.getDate()-1);
  const yStr=yDate.toISOString().slice(0,10);
  const tStr=new Date().toISOString().slice(0,10);

  let yestCards='';
  SKUS.forEach(({key,label,color,asp})=>{
    const lk=getLookup(salesData[key]);
    const y=lk[yStr],t=lk[tStr];
    const diff=(y!=null&&t!=null)?t-y:null;
    yestCards+=`<div class="yest-card" style="border-color:${color}33">
      <div style="font-size:12px;color:${color};font-weight:700;margin-bottom:6px">${label}</div>
      <div style="display:flex;gap:14px">
        <div>
          <div style="font-size:10px;color:#64748b">Yesterday</div>
          <div style="font-size:22px;font-weight:800;color:#f8fafc">${y!=null?fmt(y):'<span style="color:#334155">—</span>'}</div>
          ${y!=null?`<div style="font-size:11px;color:#64748b">$${Math.round(y*asp).toLocaleString()}</div>`:''}
        </div>
        ${t!=null?`<div>
          <div style="font-size:10px;color:#64748b">Today</div>
          <div style="font-size:22px;font-weight:800;color:${diff>=0?'#22c55e':'#ef4444'}">${fmt(t)}</div>
          <div style="font-size:11px;color:${diff>=0?'#22c55e':'#ef4444'}">$${Math.round(t*asp).toLocaleString()}</div>
          ${diff!=null?`<div style="font-size:11px;color:${diff>=0?'#22c55e':'#ef4444'}">${diff>=0?'▲'+diff:'▼'+Math.abs(diff)}</div>`:''}
        </div>`:''}
      </div>
    </div>`;
  });

  let skuCards='';
  SKUS.forEach(({key,label,color,asp})=>{
    const arr=salesData[key]||[];
    const total=arr.reduce((s,r)=>s+r.sales,0);
    const gmv=total*asp;
    const f=arr.length?arr[0].date.slice(0,7):null;
    const l=arr.length?arr[arr.length-1].date.slice(0,7):null;
    skuCards+=`<div class="sku-card" style="border-left-color:${color}">
      <div style="font-size:11px;color:${color};font-weight:700;margin-bottom:6px">${label}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <div><div style="font-size:10px;color:#64748b">Units</div><div style="font-size:20px;font-weight:800;color:#f8fafc">${fmt(total)}</div></div>
        <div><div style="font-size:10px;color:#64748b">GMV</div><div style="font-size:20px;font-weight:800;color:${color}">$${gmv>=1e6?(gmv/1e6).toFixed(1)+'M':gmv>=1000?(gmv/1000).toFixed(1)+'K':gmv.toFixed(0)}</div></div>
        <div><div style="font-size:10px;color:#64748b">ASP</div><div style="font-size:20px;font-weight:800;color:#94a3b8">$${asp.toFixed(2)}</div></div>
      </div>
      ${f?`<div style="font-size:10px;color:#475569;margin-top:6px">${f} ~ ${l}</div>`:''}
      <div style="font-size:11px;color:#94a3b8;margin-top:3px">Avg <b style="color:${color}">${getDailyAvg(arr)}</b>/day · <b style="color:${color}">$${Math.round(getDailyAvg(arr)*asp).toLocaleString()}</b>/day</div>
    </div>`;
  });

  const cutoff=new Date();cutoff.setDate(cutoff.getDate()-60);
  const cutStr=cutoff.toISOString().slice(0,10);
  const allDates=new Set();
  SKUS.forEach(({key})=>(salesData[key]||[]).forEach(r=>{if(r.date>=cutStr)allDates.add(r.date)}));
  const dates=[...allDates].sort();
  const lks={};SKUS.forEach(({key})=>{lks[key]=getLookup(salesData[key])});
  const gmvArr=dates.map(d=>{let g=0;SKUS.forEach(({key,asp})=>{const u=lks[key][d];if(u!=null)g+=u*asp});return g>0?Math.round(g):null});

  document.getElementById('tab-overview').innerHTML=`
    <div class="card" style="background:linear-gradient(135deg,#111827,#0d1929)">
      <div class="card-t">Yesterday (${yStr}) / Today (${tStr})</div>
      <div class="yest-grid">${yestCards}</div>
    </div>
    <div class="grid-4">${skuCards}</div>
    <div class="chart-wrap">
      <div class="chart-t">Last 60 Days — Daily Sales Trend</div>
      <div style="position:relative;height:210px"><canvas id="c-trend" role="img" aria-label="Daily sales trend"></canvas></div>
    </div>
    <div class="chart-wrap">
      <div class="chart-t">Last 60 Days — Daily GMV</div>
      <div style="position:relative;height:160px"><canvas id="c-gmv" role="img" aria-label="Daily GMV"></canvas></div>
    </div>`;

  killChart('trend');
  charts['trend']=new Chart(document.getElementById('c-trend'),{
    type:'line',
    data:{labels:dates.map(fmtD),datasets:SKUS.map(({key,label,color})=>({
      label,data:dates.map(d=>lks[key][d]??null),
      borderColor:color,backgroundColor:'transparent',borderWidth:2,pointRadius:0,spanGaps:true,tension:0.3
    }))},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{labels:{color:'#94a3b8',boxWidth:12}},tooltip:{...ttPlugin(),...ttCallbacks(dates)}},scales:scales()}
  });

  killChart('gmv');
  charts['gmv']=new Chart(document.getElementById('c-gmv'),{
    type:'bar',
    data:{labels:dates.map(fmtD),datasets:[{label:'GMV',data:gmvArr,backgroundColor:'#38bdf888',borderColor:'#38bdf8',borderWidth:1,borderRadius:2}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{...ttPlugin(),callbacks:{title:items=>dates[items[0].dataIndex],label:i=>`$${(i.raw||0).toLocaleString()}`}}},
      scales:{...scales(),y:{...scales().y,ticks:{...scales().y.ticks,callback:v=>v>=1000?'$'+(v/1000).toFixed(0)+'K':'$'+v}}}}
  });
}

function renderDailyFilters(){
  document.getElementById('skuFilters').innerHTML=SKUS.map(({key,label,color})=>`
    <button class="sku-filter-btn ${activeSku===key?'active':''}"
      style="${activeSku===key?`border-color:${color};background:${color}22;color:${color};font-weight:700`:''}"
      onclick="setSku('${key}')">${label}</button>`).join('');
}
function setSku(key){activeSku=key;renderDailyFilters();renderDaily(key)}

function renderDaily(key){
  const sku=SKUS.find(s=>s.key===key);
  const arr=(salesData[key]||[]).slice(-90);
  const last10=[...(salesData[key]||[])].slice(-10).reverse();
  const rows=last10.map((r,i,a)=>{
    const diff=a[i+1]?r.sales-a[i+1].sales:null;
    return `<tr><td>${r.date}</td><td><b>${fmt(r.sales)}</b></td>
      <td>$${Math.round(r.sales*sku.asp).toLocaleString()}</td>
      <td class="${diff==null?'muted-c':diff>=0?'pos':'neg'}">${diff==null?'—':diff>=0?'▲'+diff:'▼'+Math.abs(diff)}</td></tr>`;
  }).join('');

  document.getElementById('dailyContent').innerHTML=`
    <div class="chart-wrap">
      <div class="chart-t">${sku.label} — Last 90 Days</div>
      <div style="position:relative;height:240px"><canvas id="c-daily" role="img" aria-label="${sku.label} daily sales"></canvas></div>
    </div>
    <div class="card">
      <div class="card-t">Last 10 Days</div>
      <table><thead><tr><th>Date</th><th>Sales</th><th>GMV</th><th>Change</th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;

  killChart('daily');
  charts['daily']=new Chart(document.getElementById('c-daily'),{
    type:'bar',
    data:{labels:arr.map(r=>fmtD(r.date)),datasets:[{label:'Sales',data:arr.map(r=>r.sales),backgroundColor:sku.color+'aa',borderColor:sku.color,borderWidth:1,borderRadius:3}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{...ttPlugin(),callbacks:{title:items=>arr[items[0].dataIndex]?.date,label:i=>`Sales: ${(i.raw||0).toLocaleString()}`}}},
      scales:scales()}
  });
}

function renderMonthly(){
  const allM=new Set();SKUS.forEach(({key})=>(salesData[key]||[]).forEach(r=>allM.add(r.date.slice(0,7))));
  const months=[...allM].sort();
  const mLks={};SKUS.forEach(({key})=>{mLks[key]=getMonthMap(salesData[key])});
  const hdrs=SKUS.map(s=>`<th style="color:${s.color}">${s.label}</th>`).join('');
  const trows=months.slice().reverse().map(m=>{
    const total=SKUS.reduce((s,{key})=>s+(mLks[key][m]||0),0);
    const gmv=SKUS.reduce((s,{key,asp})=>s+(mLks[key][m]||0)*asp,0);
    return `<tr><td>${m.replace('-','/')}</td>${SKUS.map(({key})=>`<td>${mLks[key][m]?fmt(mLks[key][m]):'—'}</td>`).join('')}<td><b style="color:#38bdf8">${fmt(total)}</b></td><td><b style="color:#38bdf8">$${fmt(Math.round(gmv))}</b></td></tr>`;
  }).join('');

  document.getElementById('tab-monthly').innerHTML=`
    <div class="chart-wrap">
      <div class="chart-t">Monthly Sales by SKU</div>
      <div style="position:relative;height:240px"><canvas id="c-monthly" role="img" aria-label="Monthly sales"></canvas></div>
    </div>
    <div class="card">
      <div class="card-t">Monthly Breakdown</div>
      <div style="overflow-x:auto"><table style="min-width:520px">
        <thead><tr><th>Month</th>${hdrs}<th>Total</th><th>GMV</th></tr></thead>
        <tbody>${trows}</tbody>
      </table></div>
    </div>`;

  killChart('monthly');
  charts['monthly']=new Chart(document.getElementById('c-monthly'),{
    type:'bar',
    data:{labels:months.map(m=>m.replace('-','/')),datasets:SKUS.map(({key,label,color})=>({label,data:months.map(m=>mLks[key][m]||0),backgroundColor:color+'cc',stack:'a'}))},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{labels:{color:'#94a3b8',boxWidth:12}},tooltip:ttPlugin()},scales:scales(true)}
  });
}

function renderBaseline(){
  let cards='';
  SKUS.forEach(({key,label,color,asp})=>{
    const arr=salesData[key]||[];
    const daily=getDailyAvg(arr),monthly=getMonthAvg(arr),total=arr.reduce((s,r)=>s+r.sales,0);
    cards+=`<div class="sku-card" style="border-left-color:${color}">
      <div style="font-size:13px;font-weight:700;color:${color};margin-bottom:12px">${label}</div>
      <div style="display:flex;gap:16px;flex-wrap:wrap">
        ${[['Daily Baseline',daily,'units/day','$'+Math.round(daily*asp).toLocaleString()+'/day'],
           ['Monthly Baseline',fmt(monthly),'units/mo','$'+Math.round(monthly*asp).toLocaleString()+'/mo'],
           ['Total',fmt(total),'units','$'+Math.round(total*asp).toLocaleString()+' GMV']
        ].map(([l,v,u,g])=>`<div><div style="font-size:11px;color:#64748b">${l}</div><div style="font-size:22px;font-weight:800;color:#f8fafc">${v}</div><div style="font-size:11px;color:#64748b">${u}</div><div style="font-size:11px;color:${color};margin-top:2px">${g}</div></div>`).join('')}
      </div>
    </div>`;
  });
  const minis=SKUS.map(({key,label,color})=>`
    <div style="margin-bottom:18px">
      <div style="font-size:12px;font-weight:700;color:${color};margin-bottom:4px">${label} · Daily avg: <b>${getDailyAvg(salesData[key])}</b></div>
      <div style="position:relative;height:80px"><canvas id="c-mini-${key}" role="img" aria-label="${label} mini chart"></canvas></div>
    </div>`).join('');
  document.getElementById('tab-baseline').innerHTML=`
    <div style="font-size:12px;color:#64748b;margin-bottom:14px">Daily Baseline = last 30-day avg &nbsp;|&nbsp; Monthly = completed months avg</div>
    <div class="grid-2">${cards}</div>
    <div class="chart-wrap"><div class="chart-t">Last 30 Days by SKU</div>${minis}</div>`;
  SKUS.forEach(({key,color})=>{
    const arr=(salesData[key]||[]).slice(-30);
    killChart('mini-'+key);
    charts['mini-'+key]=new Chart(document.getElementById('c-mini-'+key),{
      type:'bar',
      data:{labels:arr.map(r=>fmtD(r.date)),datasets:[{data:arr.map(r=>r.sales),backgroundColor:color+'88',borderColor:color+'cc',borderWidth:1,borderRadius:2}]},
      options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
        plugins:{legend:{display:false},tooltip:{...ttPlugin(),callbacks:{title:items=>arr[items[0].dataIndex]?.date,label:i=>`Sales: ${(i.raw||0).toLocaleString()}`}}},
        scales:scales(false,true)}
    });
  });
}

function renderInput(){
  const hasToken=!!GITHUB_TOKEN;
  const recentRows=()=>{
    const allDates=new Set();
    SKUS.forEach(({key})=>(salesData[key]||[]).slice(-5).forEach(r=>allDates.add(r.date)));
    const lks={};SKUS.forEach(({key})=>{lks[key]=getLookup(salesData[key])});
    return [...allDates].sort().reverse().map(date=>`<tr><td>${date}</td>${SKUS.map(s=>`<td style="color:${lks[s.key][date]!==undefined?'#f8fafc':'#334155'}">${lks[s.key][date]??'—'}</td>`).join('')}</tr>`).join('');
  };
  document.getElementById('tab-input').innerHTML=`
    ${!hasToken?`<div class="warn-box">⚠️ <b>Token not set.</b> Open <code>index.html</code> in a text editor, find <code>GITHUB_TOKEN = ''</code> and paste your Personal Access Token. Then re-upload the file to GitHub.</div>`:''}
    <div class="info-box">💡 Data is saved directly to <b>GitHub</b>. All viewers see updated data after refreshing.</div>
    <div class="card">
      <div style="font-size:15px;font-weight:700;color:#f8fafc;margin-bottom:14px">Add Daily Sales</div>
      <div style="margin-bottom:14px">
        <label style="font-size:12px;color:#64748b;display:block;margin-bottom:6px">Date</label>
        <input type="date" id="inp-date" value="${new Date().toISOString().slice(0,10)}" style="background:var(--bg);border:1px solid #334155;border-radius:8px;padding:8px 12px;color:#f8fafc;font-size:14px;font-family:'DM Sans',sans-serif;outline:none">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
        ${SKUS.map(({key,label,color})=>`<div>
          <label style="font-size:12px;color:${color};font-weight:700;display:block;margin-bottom:6px">${label}</label>
          <input type="number" min="0" placeholder="Enter sales..." id="inp-${key}" class="inp">
        </div>`).join('')}
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn" id="saveBtn" onclick="handleSave()">Save to GitHub</button>
        <div id="saveStatus" style="font-size:13px"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-t">Recent Entries</div>
      <div style="overflow-x:auto"><table style="min-width:400px">
        <thead><tr><th>Date</th>${SKUS.map(s=>`<th style="color:${s.color}">${s.label}</th>`).join('')}</tr></thead>
        <tbody id="recentRows">${recentRows()}</tbody>
      </table></div>
    </div>`;
}

async function handleSave(){
  const btn=document.getElementById('saveBtn');
  const statusEl=document.getElementById('saveStatus');
  const date=document.getElementById('inp-date').value;
  if(!date){statusEl.style.color='#ef4444';statusEl.textContent='Please select a date';return}

  const rows=[];
  SKUS.forEach(({key})=>{
    const val=parseInt(document.getElementById('inp-'+key)?.value);
    if(!isNaN(val)&&val>=0)rows.push({key,val});
  });
  if(!rows.length){statusEl.style.color='#ef4444';statusEl.textContent='Enter at least one value';return}

  btn.disabled=true;btn.textContent='Saving...';
  statusEl.textContent='';

  const newData={...salesData};
  rows.forEach(({key,val})=>{
    const arr=[...(newData[key]||[])];
    const idx=arr.findIndex(r=>r.date===date);
    if(idx>=0)arr[idx]={date,sales:val};
    else arr.push({date,sales:val});
    arr.sort((a,b)=>a.date.localeCompare(b.date));
    const cutoff=new Date();cutoff.setDate(cutoff.getDate()-365);
    newData[key]=arr.filter(r=>r.date>=cutoff.toISOString().slice(0,10));
  });

  const result=await saveData(newData);
  btn.disabled=false;btn.textContent='Save to GitHub';

  if(result.ok){
    salesData=newData;
    statusEl.style.color='#22c55e';
    statusEl.textContent='✓ Saved! Dashboard updated.';
    SKUS.forEach(({key})=>{const el=document.getElementById('inp-'+key);if(el)el.value=''});
    document.getElementById('recentRows').innerHTML=(()=>{
      const allDates=new Set();
      SKUS.forEach(({key})=>(salesData[key]||[]).slice(-5).forEach(r=>allDates.add(r.date)));
      const lks={};SKUS.forEach(({key})=>{lks[key]=getLookup(salesData[key])});
      return [...allDates].sort().reverse().map(d=>`<tr><td>${d}</td>${SKUS.map(s=>`<td style="color:${lks[s.key][d]!==undefined?'#f8fafc':'#334155'}">${lks[s.key][d]??'—'}</td>`).join('')}</tr>`).join('');
    })();
  }else{
    statusEl.style.color='#ef4444';
    statusEl.textContent='Error: '+result.msg;
  }
  setTimeout(()=>{statusEl.textContent=''},5000);
}

function showTab(name,e){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(e?.target)e.target.classList.add('active');
}

loadData();
setInterval(loadData,5*60*1000);
</script>
</body>
